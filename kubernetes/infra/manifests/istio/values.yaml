# Gateway configuration
gateway:
  enabled: true
  name: istio-external-gateway
  namespace: istio-system
  
  # IP dal pool Cilium
  loadBalancerIP: "192.168.0.82"
  
  # TLS certificate (wildcard gestito da cert-manager)
  tls:
    secretName: "local-ildoc-it-tls"
    secretNamespace: "default"

# =====================================================
# External Services Configuration
# =====================================================
# Per aggiungere un nuovo servizio esterno, basta
# aggiungerlo qui con questa struttura
# =====================================================

externalServices:
  # Cluster Proxmox (3 nodi con load balancing)
  proxmox:
    enabled: true
    hostname: "proxmox.local.ildoc.it"
    protocol: HTTPS
    port: 8006
    skipVerify: true
    loadBalancer: ROUND_ROBIN
    
    # pve02/pve03 (.11/.12) attualmente down: lasciarli in pool fa fare
    # ROUND_ROBIN verso host morti e porta la UI a ~6s di latenza.
    # Riabilitare quando i nodi tornano up.
    endpoints:
      - address: "192.168.0.10"
      # - address: "192.168.0.11"
      # - address: "192.168.0.12"
    
    # Connection pool settings
    connectionPool:
      maxPendingRequests: 1024
      maxRequestsPerConnection: 10
      connectTimeout: "1s"
    
    # Health checking (eject rapido se un nodo torna in pool ma è down)
    outlierDetection:
      enabled: true
      consecutiveLocalOriginFailures: 2
      interval: "5s"
      baseEjectionTime: "30s"
      maxEjectionPercent: 90
  
  # TrueNAS
  truenas:
    enabled: true
    hostname: "truenas.local.ildoc.it"
    protocol: HTTPS
    port: 443
    skipVerify: true
    
    endpoints:
      - address: "192.168.0.123"
    
    connectionPool:
      maxPendingRequests: 512
      maxRequestsPerConnection: 10
  
  # Invidious (YouTube frontend)
  invidious:
    enabled: true
    hostname: "invidious.local.ildoc.it"
    protocol: HTTP
    port: 3000
    
    endpoints:
      - address: "192.168.0.111"
    
    connectionPool:
      maxPendingRequests: 512
      maxRequestsPerConnection: 10
  
  # Proxmox Backup Server
  pbs:
    enabled: true
    hostname: "pbs.local.ildoc.it"
    protocol: HTTPS
    port: 8007
    skipVerify: true
    
    endpoints:
      - address: "192.168.0.204"
    
    connectionPool:
      maxPendingRequests: 512
      maxRequestsPerConnection: 10

  # vault
  vault:
    enabled: true
    hostname: "vault.local.ildoc.it"
    protocol: HTTP
    port: 8200
    
    endpoints:
      - address: "192.168.0.50"
    
    connectionPool:
      maxPendingRequests: 512
      maxRequestsPerConnection: 10

