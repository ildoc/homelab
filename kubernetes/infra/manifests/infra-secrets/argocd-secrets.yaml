---
# ExternalSecret dedicato alle credenziali DEX/OIDC di ArgoCD
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-dex-secrets
  namespace: argocd
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-kubernetes-secret-store
    kind: ClusterSecretStore
  target:
    name: argocd-dex-secrets
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
      type: Opaque
      engineVersion: v2
      data:
        dex.authentik.clientSecret: "{{ .clientSecret }}"
  data:
  - secretKey: clientSecret
    remoteRef:
      key: kubernetes/data/infra/argocd
      property: dex-client-secret

---
# Credenziali OCI per le dipendenze Helm su registry.gitlab.local.ildoc.it
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-gitlab-registry-creds
  namespace: argocd
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-kubernetes-secret-store
    kind: ClusterSecretStore
  target:
    name: argocd-gitlab-registry-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      type: Opaque
      engineVersion: v2
      data:
        type: helm
        url: registry.gitlab.local.ildoc.it
        enableOCI: "true"
        username: "{{ .username }}"
        password: "{{ .token }}"
  data:
  - secretKey: username
    remoteRef:
      key: kubernetes/data/infra/argocd
      property: gitlab_registry_username
  - secretKey: token
    remoteRef:
      key: kubernetes/data/infra/argocd
      property: gitlab_registry_token
