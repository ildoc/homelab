          "gridPos": { "h": 3, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "options": {
            "mode": "markdown",
            "content": "**Come leggere:** `CPU%/lim` o `Mem%/lim` vicino a 100% → alza i limit. Valori stabilmente molto bassi (es. <20%) → puoi ridurre request/limit. `Throttle%` alto → il limit CPU strozza il container (come sonarr/prowlarr a 50m). Filtra un workload per il dettaglio usage vs request vs limit."
          }
