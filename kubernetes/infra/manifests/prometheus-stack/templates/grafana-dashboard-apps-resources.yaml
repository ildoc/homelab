            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "query_result(count by (workload) (label_replace(kube_pod_owner{namespace=~\"$namespace\",owner_kind=\"ReplicaSet\"},\"workload\",\"$1\",\"owner_name\",\"^(.*)-[a-z0-9]{5,10}$\") or label_replace(kube_pod_owner{namespace=~\"$namespace\",owner_kind=~\"StatefulSet|DaemonSet\"},\"workload\",\"$1\",\"owner_name\",\"(.*)\")))",
