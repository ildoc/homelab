      "time": { "from": "now-24h", "to": "now" },
      "timepicker": {
        "refresh_intervals": ["10s", "30s", "1m", "5m"],
        "time_options": ["5m", "15m", "1h", "6h", "12h", "24h", "7d", "30d"]
