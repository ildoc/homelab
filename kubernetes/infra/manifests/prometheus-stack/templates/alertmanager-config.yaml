################################################################################
# kubernetes/infra/manifests/prometheus-stack/templates/alertmanager-config.yaml
################################################################################

# ConfigMap per le configurazioni non sensibili
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    
    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      # Telegram disattivato: nessuna notifica in uscita
      receiver: 'null'
      routes: []
    
    receivers:
      - name: 'null'
    
    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'instance']
      - source_match:
          alertname: 'InfoInhibitor'
        target_match:
          severity: 'info'
        equal: ['namespace']
