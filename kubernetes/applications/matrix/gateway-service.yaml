---
apiVersion: v1
kind: Service
metadata:
  name: matrix-gateway
  namespace: apps
  labels:
    app: matrix-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: matrix-gateway
