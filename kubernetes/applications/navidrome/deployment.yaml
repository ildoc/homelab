---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: apps
spec:
  selector:
    matchLabels:
      app: navidrome
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      initContainers:
        - name: fetch-lyrics-plugin
          image: alpine:3.22
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /data/plugins
              wget -q -O /data/plugins/nd-lyrics.ndp \
                https://github.com/J0R6IT0/navidrome-lyrics-plugin/releases/latest/download/nd-lyrics.ndp
              chown 1000:1000 /data/plugins /data/plugins/nd-lyrics.ndp
              chmod 644 /data/plugins/nd-lyrics.ndp
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: navidrome
          image: deluan/navidrome:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Rome"
            - name: ND_CONFIGFILE
              value: "/config/navidrome.toml"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /music
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: navidrome
        - name: music
          nfs:
            server: 192.168.0.123
            path: /mnt/mediadisk/music
        - name: config
          configMap:
            name: navidrome

