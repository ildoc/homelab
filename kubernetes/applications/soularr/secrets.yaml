---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-soularr-secrets
  namespace: apps
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-kubernetes-secret-store
    kind: ClusterSecretStore
  target:
    name: soularr-secrets
    creationPolicy: Owner
  data:
    - secretKey: lidarr-api-key
      remoteRef:
        key: kubernetes/data/apps/soularr
        property: lidarr_api_key
    - secretKey: slskd-api-key
      remoteRef:
        key: kubernetes/data/apps/slskd
        property: api_key
