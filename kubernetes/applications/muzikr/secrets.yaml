---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-muzikr-secrets
  namespace: apps
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-kubernetes-secret-store
    kind: ClusterSecretStore
  target:
    name: muzikr-secrets
    creationPolicy: Owner
  data:
    - secretKey: auth-password
      remoteRef:
        key: kubernetes/data/apps/muzikr
        property: auth_password
    - secretKey: auth-username
      remoteRef:
        key: kubernetes/data/apps/muzikr
        property: auth_username
    - secretKey: lidarr-api-key
      remoteRef:
        key: kubernetes/data/apps/muzikr
        property: lidarr_api_key
    - secretKey: navidrome-username
      remoteRef:
        key: kubernetes/data/apps/muzikr
        property: navidrome_username
    - secretKey: navidrome-password
      remoteRef:
        key: kubernetes/data/apps/muzikr
        property: navidrome_password
    - secretKey: musicbrainz-useragentcontact
      remoteRef:
        key: kubernetes/data/apps/muzikr
        property: musicbrainz_useragentcontact
    - secretKey: spotify-client-id
      remoteRef:
        key: kubernetes/data/apps/muzikr
        property: spotify_client_id
