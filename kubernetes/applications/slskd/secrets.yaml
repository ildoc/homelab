---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-slskd-secrets
  namespace: apps
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-kubernetes-secret-store
    kind: ClusterSecretStore
  target:
    name: slskd-secrets
    creationPolicy: Owner
  data:
    - secretKey: soulseek-username
      remoteRef:
        key: kubernetes/data/apps/slskd
        property: soulseek_username
    - secretKey: soulseek-password
      remoteRef:
        key: kubernetes/data/apps/slskd
        property: soulseek_password
    - secretKey: web-password
      remoteRef:
        key: kubernetes/data/apps/slskd
        property: web_password
    - secretKey: api-key
      remoteRef:
        key: kubernetes/data/apps/slskd
        property: api_key
    - secretKey: jwt-key
      remoteRef:
        key: kubernetes/data/apps/slskd
        property: jwt_key
