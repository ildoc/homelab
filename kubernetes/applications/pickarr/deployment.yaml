---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pickarr
  namespace: apps
spec:
  selector:
    matchLabels:
      app: pickarr
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  template:
    metadata:
      labels:
        app: pickarr
    spec:
      securityContext:
        fsGroup: 1654
      containers:
        - name: pickarr
          image: ghcr.io/ildoc/pickarr:0.0.0.38
          ports:
            - containerPort: 8080
          env:
            - name: TZ
              value: "Europe/Rome"
            - name: SONARR_URL
              value: "http://sonarr:8989"
            - name: RADARR_URL
              value: "http://radarr:7878"
            - name: WATCHMODE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pickarr-secrets
                  key: watchmode-api-key
            - name: TMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pickarr-secrets
                  key: tmdb-api-key
            - name: SONARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pickarr-secrets
                  key: sonarr-api-key
            - name: RADARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pickarr-secrets
                  key: radarr-api-key
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: pickarr
