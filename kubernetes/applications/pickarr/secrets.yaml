---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-pickarr-secrets
  namespace: apps
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-kubernetes-secret-store
    kind: ClusterSecretStore
  target:
    name: pickarr-secrets
    creationPolicy: Owner
  data:
    - secretKey: watchmode-api-key
      remoteRef:
        key: kubernetes/data/apps/pickarr
        property: watchmode_api_key
    - secretKey: tmdb-token
      remoteRef:
        key: kubernetes/data/apps/pickarr
        property: 
    - secretKey: sonarr-api-key
      remoteRef:
        key: kubernetes/data/apps/pickarr
        property: sonarr_api_key
    - secretKey: radarr-api-key
      remoteRef:
        key: kubernetes/data/apps/pickarr
        property: radarr_api_key
