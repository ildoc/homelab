---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: split-db-secret
  namespace: apps
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-cross-secret-store
    kind: ClusterSecretStore
  target:
    name: split-db-secret
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: cross/data/apps/split
        property: postgres_password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: split-secret
  namespace: apps
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-kubernetes-secret-store
    kind: ClusterSecretStore
  target:
    name: split-secret
    creationPolicy: Owner
  data:
    - secretKey: jwt-key
      remoteRef:
        key: kubernetes/data/apps/split
        property: jwt_key
    - secretKey: resend-api-key
      remoteRef:
        key: kubernetes/data/apps/split
        property: resend_api_key
    - secretKey: admin-email
      remoteRef:
        key: kubernetes/data/apps/split
        property: admin_email
    - secretKey: admin-password
      remoteRef:
        key: kubernetes/data/apps/split
        property: admin_password
    - secretKey: categorization-api-key
      remoteRef:
        key: kubernetes/data/apps/split
        property: categorization_api_key

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: split-registry-creds
  namespace: apps
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-kubernetes-secret-store
    kind: ClusterSecretStore
  target:
    name: split-registry-creds
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        # Le graffe vanno emesse letterali: le interpreta External Secrets, non Helm.
        .dockerconfigjson: '{{`{"auths":{"registry.gitlab.local.ildoc.it":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}`}}'
  data:
    - secretKey: username
      remoteRef:
        key: kubernetes/data/infra/argocd
        property: gitlab_registry_username
    - secretKey: token
      remoteRef:
        key: kubernetes/data/infra/argocd
        property: gitlab_registry_token

