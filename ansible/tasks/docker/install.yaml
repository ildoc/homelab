---
- name: Check if docker is installed
  ansible.builtin.command: docker --version
  register: docker_version
  ignore_errors: true

- name: Installa docker se non presente
  when: docker_version.rc != 0
  block:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gpg
          - python3-debian
        update_cache: true

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Detect OS and architecture
      ansible.builtin.set_fact:
        docker_os: "{{ 'debian' if ansible_facts['distribution'] in ['Debian', 'Raspbian'] else 'ubuntu' }}"
        docker_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else ('armhf' if ansible_facts['architecture'] in ['armv7l', 'armv6l'] else 'amd64') }}"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ docker_os }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Get OS codename
      ansible.builtin.command: lsb_release -cs
      register: os_codename
      changed_when: false

    - name: Add Docker repository
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        architectures: "{{ docker_arch }}"
        uris: "https://download.docker.com/linux/{{ docker_os }}"
        suites: "{{ os_codename.stdout }}"
        components: [stable]
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Remove legacy Docker repository file
      ansible.builtin.file:
        path: "/etc/apt/sources.list.d/download_docker_com_linux_{{ docker_os }}.list"
        state: absent

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
          - docker-buildx-plugin
        update_cache: true

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      when: ansible_user != 'root'

- name: Apply docker group to ssh connection
  ansible.builtin.include_tasks: reset-connection.yaml
  when: docker_version.rc != 0 and ansible_user != 'root'
