gitlab:
  domain: gitlab.ildoc.it
  # Accettato da Traefik durante la migrazione dei client (ArgoCD, runner, git remote).
  legacy_domain: gitlab.ildoc.it
  # Registry solo interno: URL invariato, non esposto sul tunnel.
  registry_domain: registry.gitlab.local.ildoc.it
  # Pages solo via cloudflared (non Traefik). Sibling di gitlab.ildoc.it, non subdomain.
  # namespace_in_path: un solo hostname (Universal SSL copre *.ildoc.it, non *.pages.ildoc.it).
  # URL siti: https://pages.ildoc.it/<namespace>/<project>
  pages_domain: pages.ildoc.it
  letsencrypt_email: "{{ _secrets.gitlab.letsencrypt_email }}"
  cloudflare_token: "{{ _secrets.gitlab.cloudflare_token }}"
  cloudflared:
    # JSON intero da `cloudflared tunnel create`, non il token JWT di installazione.
    credentials: "{{ _secrets.gitlab.tunnel_credentials }}"
  cleanup:
    interval_hours: 6
    aggressive_hour: 2
    disk_threshold: 85
    prune_until_hours: 24
    max_builds: 10
