---
- name: Create data folder
  ansible.builtin.file:
    path: ~/gitlab/data
    state: directory
    mode: '0755'

- name: Create config folder
  ansible.builtin.file:
    # NON usare recurse+mode qui: riduceva le ssh_host_*_key a 0755 e sshd andava in crash-loop.
    path: ~/gitlab/config
    state: directory
    mode: '0755'

- name: Create logs folder
  ansible.builtin.file:
    path: ~/gitlab/logs
    state: directory
    mode: '0755'

- name: Create runnerconfig folder
  ansible.builtin.file:
    path: ~/runner
    state: directory
    mode: '0755'

- name: Copy entrypoint.sh
  ansible.builtin.template:
    src: entrypoint.sh
    dest: ~/gitlab/entrypoint.sh
    mode: '0755'
  register: entrypoint_result

- name: Set variables
  ansible.builtin.set_fact:
    remote_path: ~/docker-compose.yml
    template_file: docker-compose.yml
    project_path: .

- name: Include update docker-compose
  ansible.builtin.include_tasks: "{{ tasks_dir }}/docker/update-compose.yaml"
  vars:
    update_compose_remote_path: "{{ remote_path }}"
    template_file_name: "{{ template_file }}"
    update_compose_project_path: "{{ project_path }}"

- name: Get remote gitlab.rb
  ansible.builtin.stat:
    path: ~/gitlab/config/gitlab.rb
  register: remote_gitlab_rb

- name: Read remote file content
  ansible.builtin.slurp:
    src: ~/gitlab/config/gitlab.rb
  register: remote_gitlab_rb_content
  when: remote_gitlab_rb.stat.exists

- name: Render templates as string
  ansible.builtin.set_fact:
    gitlab_rb_template_rendered: "{{ lookup('template', 'gitlab.rb.j2') }}"

- name: Check text differences
  ansible.builtin.set_fact:
    gitlab_rb_different: >-
      {{
        not remote_gitlab_rb.stat.exists or
        (remote_gitlab_rb_content.content | b64decode).strip() != gitlab_rb_template_rendered.strip()
      }}

- name: Check pending reconfigure marker
  ansible.builtin.stat:
    path: ~/gitlab/config/.reconfigure_pending
  register: gitlab_reconfigure_pending

- name: Decide if GitLab reconfigure is required
  ansible.builtin.set_fact:
    gitlab_reconfigure_required: >-
      {{
        (gitlab_rb_different | bool) or
        (gitlab_reconfigure_pending.stat.exists | default(false))
      }}

- name: Are they different?
  ansible.builtin.debug:
    msg: >-
      GitLab.rb needs update: {{ gitlab_rb_different }},
      reconfigure required: {{ gitlab_reconfigure_required }}

- name: Deploy gitlab.rb when content changed
  when: gitlab_rb_different | bool
  block:
    - name: Backup existing gitlab.rb if exists
      ansible.builtin.copy:
        src: ~/gitlab/config/gitlab.rb
        dest: ~/gitlab/config/gitlab.rb.{{ ansible_date_time.epoch }}
        remote_src: true
      when: remote_gitlab_rb.stat.exists

    - name: Copy gitlab.rb
      ansible.builtin.template:
        src: gitlab.rb.j2
        dest: ~/gitlab/config/gitlab.rb
        mode: '0644'
        backup: true

    # Se il reconfigure fallisce, al run successivo il file è già allineato:
    # il marker forza il retry senza dover ritoccare il template.
    - name: Mark reconfigure as pending
      ansible.builtin.file:
        path: ~/gitlab/config/.reconfigure_pending
        state: touch
        mode: '0644'

- name: Reconfigure GitLab when required
  when: gitlab_reconfigure_required | bool
  block:
    - name: Check if GitLab container is running
      ansible.builtin.command: docker ps -q -f name=gitlab
      register: gitlab_container_running
      changed_when: false
      failed_when: false

    - name: Fail when reconfigure is required but GitLab is not running
      ansible.builtin.fail:
        msg: "GitLab container is not running; cannot apply gitlab.rb / registry DB migrations"
      when: gitlab_container_running.stdout == ""

    - name: Fix GitLab data ownership
      ansible.builtin.command: docker exec -t gitlab update-permissions
      async: 180
      poll: 10

    # update-permissions / chmod -R possono lasciare le host key a 0755 → sshd in crash-loop.
    - name: Fix SSH host key permissions after update-permissions
      ansible.builtin.include_tasks: fix_ssh_host_keys.yaml

    # update-permissions non apre la dir del socket: senza +x l'utente registry prende EACCES.
    - name: Ensure PostgreSQL socket directory is traversable
      ansible.builtin.command: >-
        docker exec -t gitlab bash -c
        "chmod 755 /var/opt/gitlab/postgresql;
         chmod 777 /var/opt/gitlab/postgresql/.s.PGSQL.* 2>/dev/null || true"

    - name: Reconfigure GitLab
      ansible.builtin.command: docker exec -t gitlab gitlab-ctl reconfigure
      register: reconfigure_result
      failed_when: false
      async: 600
      poll: 10

    - name: Fix SSH host key permissions after reconfigure
      ansible.builtin.include_tasks: fix_ssh_host_keys.yaml

    # listen_address richiede restart di PostgreSQL; al primo apply i migrate
    # del registry partono prima che TCP sia attivo (omnibus-gitlab#9931).
    - name: Restart PostgreSQL after failed reconfigure
      when: reconfigure_result.rc | default(0) != 0
      ansible.builtin.command: docker exec -t gitlab gitlab-ctl restart postgresql

    - name: Wait for PostgreSQL after restart
      when: reconfigure_result.rc | default(0) != 0
      ansible.builtin.pause:
        seconds: 15

    - name: Retry GitLab reconfigure after PostgreSQL restart
      when: reconfigure_result.rc | default(0) != 0
      ansible.builtin.command: docker exec -t gitlab gitlab-ctl reconfigure
      register: reconfigure_retry_result
      async: 600
      poll: 10

    - name: Fix SSH host key permissions after reconfigure retry
      when: reconfigure_result.rc | default(0) != 0
      ansible.builtin.include_tasks: fix_ssh_host_keys.yaml

    - name: Restart GitLab services after reconfigure
      ansible.builtin.command: docker exec -t gitlab gitlab-ctl restart
      async: 180
      poll: 10

    - name: Clear pending reconfigure marker
      ansible.builtin.file:
        path: ~/gitlab/config/.reconfigure_pending
        state: absent

    - name: Report reconfigure result
      ansible.builtin.debug:
        msg: "GitLab reconfigured successfully"

# Recupero sshd anche quando gitlab.rb non cambia (es. crash-loop host key 0755).
- name: Check if GitLab container is running for SSH key hygiene
  ansible.builtin.command: docker ps -q -f name=gitlab
  register: gitlab_container_for_ssh_keys
  changed_when: false
  failed_when: false

- name: Ensure GitLab SSH host keys are not world-readable
  when: gitlab_container_for_ssh_keys.stdout != ""
  block:
    - name: Fix SSH host key permissions
      ansible.builtin.include_tasks: fix_ssh_host_keys.yaml

    - name: Restart sshd after host key permission fix
      ansible.builtin.command: docker exec -t gitlab gitlab-ctl restart sshd
