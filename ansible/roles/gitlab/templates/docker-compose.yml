---
services:
  traefik:
    image: traefik:v3.7.5@sha256:d6858791f9e74df44ca4014166647c41cdc2abd3bf2a71b832ca4e1c6a91b257
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CF_DNS_API_TOKEN={{ _secrets.gitlab.cloudflare_token }}
    command:
      - "--configFile=/traefik.yml"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/config/traefik.yml:/traefik.yml:ro
      - ./traefik/letsencrypt:/letsencrypt
    networks:
      - traefik

  gitlab:
    image: gitlab/gitlab-ce:19.4.1-ce.0@sha256:9b33b45b9f42d176bada85ee5ecb81ddab7e506c435f44cd582206e284b2809c
    container_name: gitlab
    hostname: 'gitlab'
    depends_on:
      - traefik
    ports:
      - '22:22'
    volumes:
      - ./gitlab/config:/etc/gitlab
      - ./gitlab/logs:/var/log/gitlab
      - ./gitlab/data:/var/opt/gitlab
      - ./gitlab/entrypoint.sh:/entrypoint.sh
    command: ["/entrypoint.sh"]
    # PostgreSQL shared_buffers è 512MB: /dev/shm deve contenerlo insieme a wal_buffers.
    shm_size: '768m'
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      
      # GitLab main - router HTTP
      - "traefik.http.routers.gitlab.rule=Host(`{{ gitlab.domain }}`){% if gitlab.legacy_domain | default('') | length > 0 %} || Host(`{{ gitlab.legacy_domain }}`){% endif %}"
      - "traefik.http.routers.gitlab.entrypoints=websecure"
      - "traefik.http.routers.gitlab.tls.certresolver=cloudflare"
      - "traefik.http.routers.gitlab.service=gitlab"
      
      # GitLab main - service
      - "traefik.http.services.gitlab.loadbalancer.server.port=80"
      
      # GitLab Registry - solo interno, URL invariato
      - "traefik.http.routers.gitlab-registry.rule=Host(`{{ gitlab.registry_domain }}`)"
      - "traefik.http.routers.gitlab-registry.entrypoints=websecure"
      - "traefik.http.routers.gitlab-registry.tls.certresolver=cloudflare"
      - "traefik.http.routers.gitlab-registry.service=gitlab-registry"
      
      # GitLab Registry - service
      - "traefik.http.services.gitlab-registry.loadbalancer.server.port=5000"

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    container_name: cloudflared
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --config
      - /etc/cloudflared/config.yml
      - run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - gitlab
    networks:
      - traefik

  # runner:
  #   image: 'gitlab/gitlab-runner:latest'
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - ./runner:/etc/gitlab-runner
  #   restart: always
  #   environment:
  #     - DOCKER_HOST=unix:///var/run/docker.sock

  docker-cleanup:
    image: docker:latest@sha256:d95427251fd155cd69a03311a8c4edf6d0778595444afc2d2c800a156eb2ecac
    container_name: docker-cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - CLEANUP_INTERVAL=86400  # 24 ore in secondi
      - PRUNE_UNTIL=24h          # Rimuovi immagini più vecchie di 24 ore
    command: >
      sh -c "
        echo 'Docker cleanup service started';
        while true; do
          echo 'Running cleanup at' $$(date);
          docker system prune -af --filter 'until=$${PRUNE_UNTIL}' --volumes;
          docker image prune -af --filter 'until=$${PRUNE_UNTIL}';
          docker container prune -f --filter 'until=$${PRUNE_UNTIL}';
          docker volume prune -f;
          echo 'Cleanup completed. Sleeping for $${CLEANUP_INTERVAL} seconds';
          sleep $${CLEANUP_INTERVAL};
        done
      "
    restart: unless-stopped

networks:
  traefik:
    name: traefik
