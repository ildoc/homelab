---
- name: Inspect kubeconfig files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ kubeadm_endpoint_kubeconfig_paths }}"
  register: kubeadm_endpoint_files

- name: Require mandatory kubeconfig files
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: "Required kubeconfig {{ item.item }} is missing or is not a regular file."
  loop: "{{ kubeadm_endpoint_files.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.item in (kubeadm_endpoint_required_paths | default([]))

- name: Read kubeconfig API servers without exposing credentials
  ansible.builtin.command:
    argv:
      - kubectl
      - config
      - view
      - --kubeconfig
      - "{{ item.item }}"
      - -o
      - jsonpath={.clusters[*].cluster.server}
  loop: "{{ kubeadm_endpoint_files.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"
  register: kubeadm_endpoint_servers
  changed_when: false
  check_mode: false

- name: Require a single HTTPS cluster before changing its endpoint
  ansible.builtin.assert:
    that:
      - item.stdout.split() | length == 1
      - item.stdout | trim is match('^https://[^ \t\r\n]+$')
    fail_msg: >-
      {{ item.item.item }} must contain exactly one HTTPS cluster.
      Multi-cluster kubeconfigs must be migrated separately.
  loop: "{{ kubeadm_endpoint_servers.results }}"
  loop_control:
    label: "{{ item.item.item }}"

- name: Replace kubeconfig API servers with the VIP
  ansible.builtin.replace:
    path: "{{ item.item.item }}"
    regexp: >-
      (?m)^([ \t]*server:[ \t]*)["']?{{ item.stdout | trim | regex_escape }}["']?([ \t]*(?:#.*)?)$
    replace: '\1https://{{ kubernetes.vip_address }}:6443\2'
    backup: "{{ kubeadm_endpoint_backup | default(true) }}"
  loop: "{{ kubeadm_endpoint_servers.results }}"
  loop_control:
    label: "{{ item.item.item }}"
  when: item.stdout | trim != 'https://' ~ kubernetes.vip_address ~ ':6443'
  register: kubeadm_endpoint_rewrites
  no_log: true

- name: Read kubeconfig API servers after migration
  ansible.builtin.command:
    argv:
      - kubectl
      - config
      - view
      - --kubeconfig
      - "{{ item.item }}"
      - -o
      - jsonpath={.clusters[*].cluster.server}
  loop: "{{ kubeadm_endpoint_files.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"
  register: kubeadm_endpoint_verified_servers
  changed_when: false
  when: not ansible_check_mode

- name: Require the configured VIP in migrated kubeconfigs
  ansible.builtin.assert:
    that:
      - item.stdout | trim == 'https://' ~ kubernetes.vip_address ~ ':6443'
    fail_msg: "The API endpoint in {{ item.item.item }} was not migrated to the VIP."
  loop: "{{ kubeadm_endpoint_verified_servers.results }}"
  loop_control:
    label: "{{ item.item.item }}"
  when: not ansible_check_mode
