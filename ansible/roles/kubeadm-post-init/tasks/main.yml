---
- name: Persist the API VIP after kube-vip is running
  ansible.builtin.include_role:
    name: kubeadm_api_endpoint
    tasks_from: cluster

- name: Migrate bootstrap kubeconfigs to the API VIP
  ansible.builtin.include_role:
    name: kubeadm_api_endpoint

- name: Get join token
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_token
  changed_when: false

- name: Get cert key
  ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
  register: cert_key
  changed_when: false

- name: Store join command with VIP
  ansible.builtin.set_fact:
    join_command: >-
      {{ join_token.stdout |
         regex_replace('https://\\d+\\.\\d+\\.\\d+\\.\\d+:6443',
                       'https://' + kubernetes.vip_address + ':6443') }}
      --control-plane
      --certificate-key {{ cert_key.stdout_lines[-1] }}
  delegate_to: localhost
  delegate_facts: true
