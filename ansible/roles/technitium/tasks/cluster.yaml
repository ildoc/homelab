---
- name: Wait for the Technitium API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_http_port }}/api/sso/status"
    method: GET
    status_code: 200
  register: technitium_api
  until: technitium_api.status == 200
  retries: 30
  delay: 2

- name: Login to Technitium
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_http_port }}/api/user/login?user=admin&pass={{ _secrets.technitium.admin_password | urlencode }}&includeInfo=true"
    method: GET
    return_content: true
  register: technitium_login
  no_log: true

- name: Store the Technitium session token
  ansible.builtin.set_fact:
    technitium_token: "{{ technitium_login.json.token }}"
  no_log: true

- name: Read the cluster state
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_http_port }}/api/admin/cluster/state"
    method: GET
    headers:
      Authorization: "Bearer {{ technitium_token }}"
    return_content: true
  register: technitium_cluster_state
  no_log: true

- name: Set the node domain before cluster initialization
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_http_port }}/api/settings/set?dnsServerDomain={{ technitium_node_domain | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ technitium_token }}"
    return_content: true
  register: technitium_domain_set
  changed_when: technitium_domain_set.json.status == "ok"
  failed_when: technitium_domain_set.json.status != "ok"
  no_log: true
  when:
    - not technitium_cluster_state.json.response.clusterInitialized
    - technitium_cluster_state.json.response.dnsServerDomain != technitium_node_domain

- name: Wait for the API after the domain change
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_http_port }}/api/sso/status"
    method: GET
    status_code: 200
  register: technitium_api_after_domain
  until: technitium_api_after_domain.status == 200
  retries: 30
  delay: 2
  when: technitium_domain_set is changed

- name: Re-login after the domain change
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_http_port }}/api/user/login?user=admin&pass={{ _secrets.technitium.admin_password | urlencode }}&includeInfo=true"
    method: GET
    return_content: true
  register: technitium_login
  retries: 10
  delay: 2
  until: technitium_login.json.token is defined
  no_log: true
  when: technitium_domain_set is changed

- name: Refresh the Technitium session token after the domain change
  ansible.builtin.set_fact:
    technitium_token: "{{ technitium_login.json.token }}"
  no_log: true
  when: technitium_domain_set is changed

- name: Initialize the cluster on the primary
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_http_port }}/api/admin/cluster/init"
    method: POST
    headers:
      Authorization: "Bearer {{ technitium_token }}"
    body_format: form-urlencoded
    body:
      clusterDomain: "{{ technitium_cluster_domain }}"
      primaryNodeIpAddresses: "{{ ansible_host }}"
    return_content: true
  register: technitium_cluster_init
  changed_when: technitium_cluster_init.json.status == "ok"
  failed_when: technitium_cluster_init.json.status != "ok"
  no_log: true
  when:
    - technitium_node_role == "primary"
    - not technitium_cluster_state.json.response.clusterInitialized

- name: Identify the primary node
  ansible.builtin.set_fact:
    technitium_primary_name: "{{ groups['technitium_dns'] | map('extract', hostvars) | selectattr('technitium_node_role', 'equalto', 'primary') | map(attribute='inventory_hostname') | first }}"

- name: Check that the primary HTTPS endpoint is reachable from the secondary
  ansible.builtin.uri:
    url: "https://{{ hostvars[technitium_primary_name]['ansible_host'] }}:{{ technitium_https_port }}/"
    method: GET
    validate_certs: false
    status_code: [200, 302, 401, 403]
    timeout: 15
  when:
    - technitium_node_role == "secondary"
    - not technitium_cluster_state.json.response.clusterInitialized

- name: Join the cluster on a secondary
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_http_port }}/api/admin/cluster/initJoin"
    method: POST
    headers:
      Authorization: "Bearer {{ technitium_token }}"
    body_format: form-urlencoded
    body:
      secondaryNodeIpAddresses: "{{ ansible_host }}"
      primaryNodeUrl: "https://{{ technitium_primary_name }}.{{ technitium_cluster_domain }}:{{ technitium_https_port }}/"
      primaryNodeIpAddress: "{{ hostvars[technitium_primary_name]['ansible_host'] }}"
      ignoreCertificateErrors: "true"
      primaryNodeUsername: admin
      primaryNodePassword: "{{ _secrets.technitium.admin_password }}"
    return_content: true
    timeout: 180
  register: technitium_cluster_join
  changed_when: technitium_cluster_join.json.status | default('') == "ok"
  failed_when: false
  no_log: true
  when:
    - technitium_node_role == "secondary"
    - not technitium_cluster_state.json.response.clusterInitialized

- name: Fail with the Technitium cluster join error
  ansible.builtin.fail:
    msg: >-
      Cluster join failed:
      {{ (technitium_cluster_join.json | default({})).errorMessage
         | default((technitium_cluster_join.json | default({})).errorMessageId
         | default((technitium_cluster_join.json | default({})).status
         | default(technitium_cluster_join.msg | default('unknown error')))) }}
  when:
    - technitium_node_role == "secondary"
    - not technitium_cluster_state.json.response.clusterInitialized
    - technitium_cluster_join is not skipped
    - (technitium_cluster_join.json | default({})).status | default('error') != "ok"

- name: List DHCP scopes
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_http_port }}/api/dhcp/scopes/list"
    method: GET
    headers:
      Authorization: "Bearer {{ technitium_token }}"
    return_content: true
  register: technitium_dhcp_scopes
  no_log: true
  when: not technitium_dhcp_enabled

- name: Disable every enabled DHCP scope
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_http_port }}/api/dhcp/scopes/disable?name={{ item.name | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ technitium_token }}"
    return_content: true
  loop: "{{ technitium_dhcp_scopes.json.response.scopes | default([]) }}"
  when:
    - not technitium_dhcp_enabled
    - item.enabled | bool
  loop_control:
    label: "{{ item.name }}"
  no_log: true
