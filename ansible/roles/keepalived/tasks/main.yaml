---
- name: Check whether keepalived is already installed
  ansible.builtin.command: dpkg-query -W -f='${Status}' keepalived
  register: keepalived_pkg
  changed_when: false
  failed_when: false

- name: Install keepalived
  ansible.builtin.apt:
    name: keepalived
    state: present
    lock_timeout: 60
  when: "'install ok installed' not in keepalived_pkg.stdout"

- name: Install the Technitium health check
  ansible.builtin.template:
    src: check_technitium.sh.j2
    dest: /usr/local/bin/check_technitium.sh
    mode: "0755"
  notify: Reload keepalived

- name: Install the keepalived configuration
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    mode: "0644"
    validate: keepalived -t -f %s
  notify: Reload keepalived

- name: Enable keepalived
  ansible.builtin.systemd:
    name: keepalived
    enabled: true
    state: started
